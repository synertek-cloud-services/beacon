name: Feature request
description: Propose a new capability or a meaningful improvement
title: "[Feature]: "
labels:
  - "type: feature"
  - "needs: triage"
body:
  - type: markdown
    attributes:
      value: |
        Describe the operational problem before prescribing an implementation. This helps us evaluate the smallest solution that fits Beacon's architecture.

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What is difficult or impossible today, and who is affected?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe what success looks like from the user's perspective.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain a possible workflow or behavior. Implementation details are optional.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Agent
        - Worker / API
        - Dashboard
        - Database / migrations
        - Authentication / security
        - Remote sessions
        - Jobs / components
        - Policies / alerts
        - Release / infrastructure
        - Unknown or multiple areas
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note current workarounds or other approaches you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized examples, mockups, or related issues. Do not include secrets or customer data.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and discussions for similar requests.
          required: true
        - label: I described the underlying problem and desired outcome.
          required: true
